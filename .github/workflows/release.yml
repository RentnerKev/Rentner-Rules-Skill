name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rentner Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Validate release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use SemVer format, e.g. v1.0.0"
            exit 1
          fi

      - name: Validate required files
        shell: bash
        run: |
          for file in SKILL.md README.md LICENSE agents/openai.yaml \
            agents/README.md agents/codex.md agents/cursor.md \
            agents/claude-code.md agents/gemini-cli.md \
            agents/github-copilot.md agents/windsurf.md \
            agents/opencode.md agents/universal.md \
            references/typescript/index.md references/typescript/architecture.md \
            references/typescript/frontend.md \
            references/typescript/dependencies-and-config.md \
            references/typescript/tooling.md \
            references/typescript/backend-and-safety.md \
            references/typescript/workflow-and-verification.md \
            references/rust/index.md references/rust/architecture.md \
            references/rust/coding.md references/rust/cargo-and-tooling.md \
            references/rust/testing-and-verification.md \
            references/rust/safety-and-runtime.md \
            references/hybrid/index.md references/hybrid/architecture.md \
            references/hybrid/contracts-and-boundaries.md \
            references/hybrid/workflow-and-verification.md \
            references/tauri/index.md references/tauri/architecture.md \
            references/tauri/frontend-and-ipc.md \
            references/tauri/security-and-capabilities.md \
            references/tauri/desktop-and-runtime.md \
            references/tauri/workflow-and-verification.md; do
            test -s "$file" || {
              echo "::error::$file is missing or empty"
              exit 1
            }
          done

      - name: Validate references and interface metadata
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, readdirSync } from 'node:fs'
          import { dirname, resolve, sep } from 'node:path'

          const root = process.cwd()
          const markdownFiles = (directory) => readdirSync(directory, { withFileTypes: true })
              .flatMap((entry) => {
                  const path = directory + '/' + entry.name
                  if (entry.isDirectory()) return markdownFiles(path)
                  return entry.isFile() && entry.name.endsWith('.md') ? [path] : []
              })
          const files = [
              'SKILL.md',
              'README.md',
              ...markdownFiles('references'),
              ...markdownFiles('agents'),
          ]

          for (const file of files) {
              const content = readFileSync(file, 'utf8')
              for (const match of content.matchAll(/\[[^\]\n]+\]\(([^)\s]+)\)/g)) {
                  const target = match[1]
                  if (/^https?:\/\//.test(target) || target.startsWith('#')) continue
                  const destination = resolve(dirname(file), target.split('#')[0])
                  if (!destination.startsWith(root + sep) || !existsSync(destination)) {
                      throw new Error(file + ': invalid local reference ' + target)
                  }
              }
          }

          const metadata = readFileSync('agents/openai.yaml', 'utf8')
          const shortDescription = metadata.match(/^  short_description: "([^"]+)"$/m)?.[1]
          if (!shortDescription || shortDescription.length < 25 || shortDescription.length > 64) {
              throw new Error('Codex short_description must contain 25–64 characters')
          }
          const defaultPrompt = metadata.match(/^  default_prompt: "([^"]+)"$/m)?.[1]
          if (!defaultPrompt?.includes('$rentner-rules')) {
              throw new Error('Codex default_prompt must invoke $rentner-rules')
          }
          console.log('Validated ' + files.length + ' Markdown files and Codex interface metadata')
          JS

      - name: Validate skill discovery
        shell: bash
        run: npx --yes skills@1.7.0 add . --list
